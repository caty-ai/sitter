name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

# Superseded runs on the same ref are cancelled immediately.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ver="$(./sitter --version)"
          test "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME"
          test "sitter ${GITHUB_REF_NAME#v}" = "$ver"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
      - if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: bash scripts/packaged-tarball-install-test.sh
  # The development machine is macOS and every lane runs the full suite
  # locally before a PR opens, so PR-time macOS coverage duplicates those
  # runs. macOS and Windows are merge gates on main pushes instead.
  macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck sitter tests/*.sh tests/fixtures/*.sh scripts/*.sh examples/*.sh
